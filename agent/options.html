<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      max-width: 520px;
      margin: 24px auto;
      font: 14px/1.6 system-ui, sans-serif;
      color: #0f172a;
    }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    button {
      margin-top: 16px;
      padding: 8px 20px;
      border: 0;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      cursor: pointer;
    }
    #status { margin-left: 12px; color: #16a34a; }
  </style>
</head>
<body>
  <h1>chrome-EDR 設定</h1>
  <p>イベント送信先のバックエンドを設定します。未設定の間はローカル記録のみ行います。</p>
  <label for="endpoint">エンドポイントURL</label>
  <input id="endpoint" placeholder="http://localhost:8787" />
  <label for="apiKey">テナントAPIキー</label>
  <input id="apiKey" type="password" placeholder="POST /v1/tenants で発行したキー" />
  <button id="save">保存</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
